<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikasi Internasional UNAND</title>
    
    <!-- Memuat Tailwind CSS dari CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat ikon Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Kustomisasi Animasi CSS Tambahan -->
    <style>
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-slide {
            animation: fadeSlideUp 0.4s ease-out forwards;
        }
        
        /* Memastikan tampilan tidak melebihi tinggi layar/kontainer dan menyembunyikan scroll utama */
        .wp-embed-container {
            height: 650px;
            max-height: 90vh;
        }
        
        /* Memperbaiki tampilan scrollbar agar lebih rapi */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body>

    <!-- Wadah Utama Aplikasi (Tinggi dibuat spesifik agar pas di WordPress) -->
    <div class="wp-embed-container bg-slate-100 font-sans text-slate-800 p-2 md:p-4 flex flex-col overflow-hidden rounded-xl shadow-sm border border-slate-200 w-full mx-auto" style="max-width: 1152px;">
        
        <!-- Header -->
        <header class="w-full mx-auto mb-4 text-center shrink-0">
            <div class="inline-flex items-center justify-center p-2.5 bg-white rounded-xl shadow-sm mb-2">
                <i data-lucide="award" class="w-6 h-6 text-green-600 mr-2"></i>
                <h1 class="text-xl md:text-2xl font-extrabold text-green-800 tracking-tight">
                    SERTIFIKASI INTERNASIONAL UNAND
                </h1>
            </div>
            <p class="text-slate-500 text-sm max-w-2xl mx-auto hidden md:block">
                Pilih kategori sertifikasi di bawah ini untuk melihat detail unit, lembaga, dan program studi.
            </p>
        </header>

        <!-- Area Konten Utama -->
        <main class="w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1 min-h-0">
            
            <!-- Sisi Kiri: Kategori Interaktif -->
            <div id="sidebar-container" class="lg:col-span-4 space-y-3 overflow-y-auto pr-2 pb-2 custom-scrollbar">
                <!-- Tombol sidebar akan dirender oleh JavaScript -->
            </div>

            <!-- Sisi Kanan: Tampilan Grafis Detail -->
            <div class="lg:col-span-8 h-full min-h-0">
                <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden h-full flex flex-col">
                    
                    <!-- Header Panel -->
                    <div id="panel-header" class="bg-slate-800 p-4 text-white flex justify-between items-center relative overflow-hidden shrink-0">
                        <!-- Konten header panel akan dirender oleh JavaScript -->
                    </div>

                    <!-- Konten Panel (Grid Grafis) -->
                    <div id="panel-content" class="p-4 flex-1 bg-slate-50 overflow-y-auto custom-scrollbar">
                        <!-- Item grid akan dirender oleh JavaScript -->
                    </div>
                    
                    <!-- Dekorasi Footer -->
                    <div class="h-1.5 flex w-full shrink-0">
                       <div class="flex-1 bg-cyan-500"></div>
                       <div class="flex-1 bg-lime-500"></div>
                       <div class="flex-1 bg-emerald-500"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Data Sertifikasi
        const dataSertifikasi = {
            '17025': {
                id: '17025',
                title: 'ISO/IEC 17025:2017',
                subtitle: 'Kompetensi Laboratorium',
                desc: 'Sertifikasi untuk kompetensi laboratorium',
                color: 'bg-cyan-500',
                lightColor: 'bg-cyan-50',
                textColor: 'text-cyan-700',
                borderColor: 'border-cyan-500',
                hoverBorder: 'hover:border-cyan-300',
                icon: 'microscope',
                items: ['Lab. Sentral UNAND']
            },
            '21001': {
                id: '21001',
                title: 'ISO 21001:2018',
                subtitle: 'Manajemen Pendidikan',
                desc: 'Sertifikasi untuk sistem manajemen pendidikan',
                color: 'bg-lime-500',
                lightColor: 'bg-lime-50',
                textColor: 'text-lime-700',
                borderColor: 'border-lime-500',
                hoverBorder: 'hover:border-lime-300',
                icon: 'book-open',
                items: [
                    'Prodi S1 Sastra Indonesia',
                    'Prodi S1 Kedokteran',
                    'Prodi Pendidikan Profesi Dokter',
                    'Prodi S1 Teknik Elektro',
                    'Prodi S1 Teknik Lingkungan'
                ]
            },
            '9001': {
                id: '9001',
                title: 'ISO 9001:2015',
                subtitle: 'Manajemen Mutu',
                desc: 'Sertifikasi untuk sistem manajemen mutu',
                color: 'bg-emerald-500',
                lightColor: 'bg-emerald-50',
                textColor: 'text-emerald-700',
                borderColor: 'border-emerald-500',
                hoverBorder: 'hover:border-emerald-300',
                icon: 'shield-check',
                items: ['Lembaga Penjaminan Mutu UNAND']
            }
        };

        // State Aplikasi
        let activeTab = 'all';

        // Fungsi untuk mengganti tab
        window.setActiveTab = function(tabId) {
            activeTab = tabId;
            renderApp();
        };

        // Fungsi Utama untuk me-render antarmuka
        function renderApp() {
            renderSidebar();
            renderPanel();
            // Inisialisasi ulang ikon Lucide setelah memanipulasi DOM
            lucide.createIcons();
        }

        // Render Sidebar (Kiri)
        function renderSidebar() {
            const sidebarContainer = document.getElementById('sidebar-container');
            
            const isAllActive = activeTab === 'all';
            
            // Hitung total semua item
            const totalAllItems = Object.values(dataSertifikasi).reduce((acc, curr) => acc + curr.items.length, 0);

            let html = `
                <button onclick="setActiveTab('all')" class="w-full text-left transition-all duration-300 rounded-xl border-2 ${isAllActive ? 'bg-slate-800 border-slate-800 text-white shadow-md' : 'bg-white border-transparent text-slate-700 shadow-sm hover:border-slate-300'} p-4 flex items-center justify-between group">
                    <div>
                        <h2 class="text-lg font-bold mb-0.5">Sertifikasi ISO</h2>
                        <p class="text-xs ${isAllActive ? 'text-slate-300' : 'text-slate-500'}">Tampilkan Semua</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isAllActive ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'}">${totalAllItems} Unit</span>
                        <i data-lucide="building-2" class="w-7 h-7 ${isAllActive ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'}"></i>
                    </div>
                </button>
                <div class="space-y-2 mt-2">
            `;

            Object.values(dataSertifikasi).forEach(cert => {
                const isActive = activeTab === cert.id;
                const itemCount = cert.items.length;
                
                html += `
                    <button onclick="setActiveTab('${cert.id}')" class="w-full text-left transition-all duration-300 rounded-xl p-3 flex items-start justify-between border-2 ${isActive ? cert.color + ' border-transparent text-white shadow-md transform scale-[1.01]' : 'bg-white border-transparent text-slate-700 shadow-sm ' + cert.hoverBorder}">
                        <div class="flex items-start space-x-3">
                            <div class="p-2 rounded-lg ${isActive ? 'bg-white/20' : cert.lightColor} shrink-0">
                                <i data-lucide="${cert.icon}" class="w-5 h-5 ${isActive ? 'text-white' : cert.textColor}"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm leading-tight">${cert.title}</h3>
                                <p class="text-xs mt-1 ${isActive ? 'text-white/90' : 'text-slate-500'}">${cert.desc}</p>
                            </div>
                        </div>
                        <div class="shrink-0 pt-1">
                            <span class="text-[10px] font-bold px-2 py-1 rounded-md ${isActive ? 'bg-white/20 text-white' : cert.lightColor + ' ' + cert.textColor}">${itemCount} Unit</span>
                        </div>
                    </button>
                `;
            });

            html += `</div>`;
            sidebarContainer.innerHTML = html;
        }

        // Render Panel Konten (Kanan)
        function renderPanel() {
            const panelHeader = document.getElementById('panel-header');
            const panelContent = document.getElementById('panel-content');
            
            const filteredData = activeTab === 'all' 
                ? Object.values(dataSertifikasi) 
                : [dataSertifikasi[activeTab]];
                
            const totalItems = filteredData.reduce((acc, curr) => acc + curr.items.length, 0);
            
            // Header HTML
            panelHeader.innerHTML = `
                <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/3"></div>
                <div class="relative z-10">
                    <h2 class="text-lg font-bold">
                        ${activeTab === 'all' ? 'Daftar Penerima Sertifikasi' : dataSertifikasi[activeTab].title}
                    </h2>
                    <p class="text-slate-300 text-xs mt-0.5">
                        ${activeTab === 'all' ? 'Menampilkan seluruh lembaga dan program studi' : dataSertifikasi[activeTab].subtitle}
                    </p>
                </div>
                <div class="bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-sm text-center relative z-10 border border-white/20">
                    <div class="text-xl font-black leading-none">${totalItems}</div>
                    <div class="text-[10px] text-slate-300 uppercase tracking-wider font-semibold mt-0.5">Unit</div>
                </div>
            `;

            // Content HTML
            let contentHtml = '<div class="space-y-4">';
            
            filteredData.forEach(category => {
                contentHtml += `<div class="animate-fade-slide">`;
                
                if (activeTab === 'all') {
                    contentHtml += `
                        <div class="flex items-center space-x-2 mb-3 pb-2 border-b border-slate-200">
                            <div class="p-1.5 rounded-md ${category.lightColor}">
                                <i data-lucide="${category.icon}" class="w-4 h-4 ${category.textColor}"></i>
                            </div>
                            <h3 class="text-sm font-bold ${category.textColor}">
                                ${category.title} <span class="text-slate-400 text-xs font-normal ml-1">(${category.subtitle})</span>
                            </h3>
                        </div>
                    `;
                }

                contentHtml += `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
                
                category.items.forEach(item => {
                    contentHtml += `
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 hover:shadow hover:-translate-y-0.5 transition-all duration-300 relative overflow-hidden group flex flex-col h-full cursor-default">
                            <div class="absolute -right-4 -top-4 w-12 h-12 rounded-full opacity-10 group-hover:scale-[3] transition-transform duration-500 ease-in-out ${category.color}"></div>
                            
                            <div class="flex items-start justify-between mb-2 relative z-10">
                                <div class="p-1.5 rounded-lg ${category.lightColor} border border-white shadow-inner">
                                    <i data-lucide="building-2" class="w-4 h-4 ${category.textColor}"></i>
                                </div>
                                <i data-lucide="check-circle-2" class="w-4 h-4 ${category.textColor} opacity-20 group-hover:opacity-100 transition-opacity duration-300"></i>
                            </div>
                            
                            <div class="relative z-10 flex-grow">
                                <h4 class="text-sm font-bold text-slate-800 leading-snug mb-1">
                                    ${item}
                                </h4>
                            </div>
                            
                            <div class="mt-2 flex items-center text-[10px] font-bold uppercase tracking-wider text-slate-400 relative z-10">
                                <span class="flex h-1.5 w-1.5 relative mr-1.5">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${category.color}"></span>
                                    <span class="relative inline-flex rounded-full h-1.5 w-1.5 ${category.color}"></span>
                                </span>
                                Tersertifikasi
                            </div>
                        </div>
                    `;
                });
                
                contentHtml += `</div></div>`;
            });
            
            contentHtml += '</div>';
            panelContent.innerHTML = contentHtml;
        }

        // Jalankan render pertama kali saat halaman dimuat
        document.addEventListener('DOMContentLoaded', renderApp);

    </script>
</body>
</html>
